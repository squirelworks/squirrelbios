# AArch64 UEFI-class firmware for a Raspberry Pi 4 (boards/rpi4): the
# image the Pi's firmware loads as kernel8.img (or kernel=), linked to run
# where it puts it, 0x80000, with the device tree in x0. The PL011 below
# is only used until the tree is read; there is no fw_cfg.
CONFIG_FW_BASE=0x80000
CONFIG_UART_BASE=0xFE201000
CONFIG_FWCFG_BASE=0
