# StarFive VisionFive 2 (JH7110): boards/visionfive2.
# Linked where the vendor SPL loads OpenSBI (CONFIG_SPL_OPENSBI_LOAD_ADDR /
# OpenSBI FW_TEXT_START = 0x40000000). UART0 is the DesignWare APB UART
# (32-bit registers, reg-shift 2, 24 MHz). No QEMU fw_cfg on the board.
# QEMU has no JH7110 machine: build-only in make test; board smoke is optional.
CONFIG_FW_BASE=0x40000000
CONFIG_UART_BASE=0x10000000
CONFIG_UART_SHIFT=2
CONFIG_UART_IO_WIDTH=4
CONFIG_UART_CLOCK=24000000
CONFIG_CLINT_BASE=0x02000000
CONFIG_MAX_HARTS=5
CONFIG_FWCFG_BASE=0
