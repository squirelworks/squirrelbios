# RISC-V UEFI-class firmware for QEMU virt: the build plain `make` produces.
# The SBI uses the UART address, hart count and firmware base; the UEFI
# core takes its UART and fw_cfg from the device tree and falls back to these.
CONFIG_FW_BASE=0x80000000
CONFIG_UART_BASE=0x10000000
CONFIG_UART_SHIFT=0
CONFIG_UART_IO_WIDTH=1
CONFIG_UART_CLOCK=3686400
CONFIG_MAX_HARTS=512
CONFIG_FWCFG_BASE=0x10100000
