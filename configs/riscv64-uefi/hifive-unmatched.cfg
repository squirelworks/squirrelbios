# SiFive HiFive Unmatched (FU740): boards/hifive-unmatched.
# Linked where the vendor SPL loads OpenSBI (RAM / FW_TEXT_START =
# 0x80000000). UART0 is sifive,uart0 at 0x10010000 (its own register
# layout: txdata/rxdata/txctrl/rxctrl/div — not 16550; CONFIG_UART_BASE
# is wired here, the putc/getc kind is a later step). No QEMU fw_cfg.
# QEMU has no Unmatched machine (sifive_u is FU540-like): build-only in
# make test; board / sifive_u smoke is optional.
CONFIG_FW_BASE=0x80000000
CONFIG_UART_BASE=0x10010000
CONFIG_UART_SHIFT=0
CONFIG_UART_IO_WIDTH=1
CONFIG_UART_CLOCK=3686400
CONFIG_CLINT_BASE=0x02000000
CONFIG_MAX_HARTS=5
CONFIG_FWCFG_BASE=0
