# SiFive HiFive Unmatched (FU740): boards/hifive-unmatched.
# Linked where the vendor SPL loads OpenSBI (RAM / FW_TEXT_START =
# 0x80000000). UART0 is sifive,uart0 at 0x10010000 (txdata/rxdata/txctrl/
# rxctrl/div — not 16550). CONFIG_UART_KIND=1 selects that putc/getc;
# the device tree also sets the kind when it names sifive,uart0. No QEMU
# fw_cfg. QEMU has no Unmatched machine; sifive_u (FU540-like, same UART
# IP at the same base) smokes the putc path in make test.
CONFIG_FW_BASE=0x80000000
CONFIG_UART_BASE=0x10010000
CONFIG_UART_KIND=1
CONFIG_UART_SHIFT=0
CONFIG_UART_IO_WIDTH=1
CONFIG_UART_CLOCK=3686400
CONFIG_CLINT_BASE=0x02000000
CONFIG_MAX_HARTS=5
CONFIG_FWCFG_BASE=0
