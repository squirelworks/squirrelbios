# Optional CONTINUANCE Phase G smoke: host FDT fuzzer corpus (not a nightly).
# Not part of the required make-test gate.
name: fuzz-fdt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "common/efi/fdt.c"
      - "common/fw/fdt.c"
      - "common/fw/fdt.h"
      - "common/efi/lib.c"
      - "common/efi/include/**"
      - "fuzz/**"
      - "Makefile"
      - ".github/workflows/fuzz-fdt.yml"
  push:
    paths:
      - "common/efi/fdt.c"
      - "common/fw/fdt.c"
      - "common/fw/fdt.h"
      - "common/efi/lib.c"
      - "common/efi/include/**"
      - "fuzz/**"
      - "Makefile"
      - ".github/workflows/fuzz-fdt.yml"

jobs:
  fuzz-fdt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make gcc python3

      - name: make fuzz-fdt
        run: make fuzz-fdt
