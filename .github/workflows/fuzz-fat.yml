# Optional CONTINUANCE Phase G smoke: host FAT fuzzer corpus (not a nightly).
# Not part of the required make-test gate.
name: fuzz-fat

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "common/efi/fat.c"
      - "common/efi/lib.c"
      - "common/efi/include/**"
      - "fuzz/**"
      - "Makefile"
      - ".github/workflows/fuzz-fat.yml"
  push:
    paths:
      - "common/efi/fat.c"
      - "common/efi/lib.c"
      - "common/efi/include/**"
      - "fuzz/**"
      - "Makefile"
      - ".github/workflows/fuzz-fat.yml"

jobs:
  fuzz-fat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make gcc python3

      - name: make fuzz-fat
        run: make fuzz-fat
